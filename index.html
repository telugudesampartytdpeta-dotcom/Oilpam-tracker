<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oil Palm Harvester Tracker</title>
    <link rel="stylesheet" href="style.css">
    <!-- SheetJS (Excel ఫైల్స్ రీడ్ చేయడానికి) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

    <header>
        <h1>Oil Palm Harvester Tracker</h1>
        <p>రైతులు మరియు హార్వెస్ట్ వివరాల నిర్వహణ యాప్</p>
    </header>

    <div class="container">
        
        <!-- డాష్‌బోర్డ్ కార్డ్స్ -->
        <div class="dashboard">
            <div class="card">
                <h2 id="farmerCount">0</h2>
                <p>Active Farmers</p>
            </div>
            <div class="card">
                <h2 id="landCount">0</h2>
                <p>Active Lands</p>
            </div>
            <div class="card">
                <h2 id="harvestCount">0</h2>
                <p>Active Tasks</p>
            </div>
            <div class="card">
                <h2 id="totalTons">0</h2>
                <p>Total Tons</p>
            </div>
        </div>

        <!-- ఎక్సెల్ ఫైల్ అప్‌లోడ్ సెక్షన్ -->
        <div class="formBox">
            <h2>Excel / CSV File Upload</h2>
            <input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv">
            <button id="importBtn" style="margin-top:10px;">Upload & Import Data</button>
        </div>

        <!-- ఫారమ్‌లు పక్కపక్కనే (Side by Side) రావడానికి -->
        <div class="form-row">
            <div class="formBox">
                <h2>Add Farmer</h2>
                <select id="farmerNameSelect"></select>
                <input type="text" id="sapId" placeholder="SAP ID">
                <input type="text" id="ownerId" placeholder="Owner ID">
                <input type="text" id="supplier" placeholder="Supplier Name">
                <button id="saveFarmer">Save Farmer
                
                 </button>
            </div>

            <div class="formBox">
                <h2>Add Land ID / Details</h2>
                <select id="farmerSelect">
                    <option value="">Select Farmer</option>
                </select>
                <input type="text" id="landId" placeholder="Land ID">
                <input type="number" id="landArea" placeholder="Area in Acres">
                <button id="saveLand">Save Land</button>
            </div>
        </div>

        <!-- హార్వెస్ట్ ఎంట్రీ ఫారమ్ -->
        <div class="formBox">
            <h2>Add Harvest Entry</h2>
            <select id="harvestFarmer">
                <option value="">Select Farmer</option>
            </select>
            <select id="harvestLand">
                <option value="">Select Land</option>
            </select>
            <input type="date" id="harvestDate">
            <input type="number" id="harvestAcres" placeholder="Harvested Acres">
            <input type="number" id="harvestTons" placeholder="Harvested Tons">
            <button id="saveHarvest">Save Harvest
             </button>
        </div>

<!-- 10 Days Harvest Alert Icon -->
<div style="position: relative; display: inline-block; cursor: pointer;" onclick="toggleHarvestPopup()">
    <span style="font-size: 24px;" title="10 Days Harvest Alerts">🔔</span>
    <span id="harvestBadgeCount" style="position: absolute; top: -5px; right: -10px; background: red; color: white; border-radius: 50%; padding: 2px 6px; font-size: 11px; font-weight: bold;">0</span>
</div>

<!-- Popup Box (Initially Hidden) -->
<div id="harvestPopupModal" style="display: none; position: absolute; right: 0; top: 35px; width: 320px; background: white; border: 1px solid #ccc; box-shadow: 0 4px 8px rgba(0,0,0,0.15); border-radius: 8px; z-index: 1000; padding: 10px;">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 5px;">
        <strong style="font-size: 14px; color: #333;">10 Days Harvest Status</strong>
        <button onclick="toggleHarvestPopup()" style="background: none; border: none; font-size: 16px; cursor: pointer; color: #888;">✕</button>
        
    </div>
    <div id="harvestPopupContent" style="max-height: 250px; overflow-y: auto; margin-top: 8px; font-size: 13px;">
        <!-- Dynamic list items will come here -->
        
    </div>
</div>



        <!-- డేట్ రేంజ్ ఫిల్టర్ & CSV డౌన్‌లోడ్ సెక్షన్ -->
        <div class="topBar">
            <div style="flex: 1; min-width: 140px;">
                <label>Start Date:</label>
                <input type="date" id="startDate">
            </div>
            <div style="flex: 1; min-width: 140px;">
                <label>End Date:</label>
                <input type="date" id="endDate">
            </div>
            <div style="flex: 1; min-width: 140px; display: flex; align-items: flex-end;">
                <button id="downloadCSV">Download CSV</button>
            </div>
        </div>

        <!-- సెర్చ్ బార్ & రైతు జాబితా -->
        <div class="formBox">
            <h2>Farmers List</h2>
            <input type="text" id="search" placeholder="రైతు పేరు లేదా SAP ID తో వెతకండి...">
            <div id="farmerList" style="margin-top: 15px;"></div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
